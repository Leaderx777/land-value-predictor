name: peoria-research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/peoria-research.yml"
      - "sources/peoria_county.py"
      - "scripts/fetch_peoria_data.py"
      - "scripts/profile_peoria_sales.py"
      - "scripts/build_peoria_class_mapping.py"
      - "real_data.py"
      - "train_peoria_baseline.py"
      - "requirements.txt"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Fetch official Peoria County data
        run: python scripts/fetch_peoria_data.py
      - name: Profile and clean sales
        run: python scripts/profile_peoria_sales.py
      - name: Build property-class mapping template
        run: python scripts/build_peoria_class_mapping.py
      - name: Train chronological research baseline
        run: python train_peoria_baseline.py
      - name: Upload research summaries
        uses: actions/upload-artifact@v4
        with:
          name: peoria-research-results
          path: |
            artifacts/real_data/peoria_property_class_profile.csv
            artifacts/real_data/peoria_property_class_mapping.csv
            artifacts/peoria_baseline/metrics.json
          if-no-files-found: error
          retention-days: 14
