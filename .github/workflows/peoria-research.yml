name: peoria-research

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Fetch official Peoria County data
        run: python -m scripts.fetch_peoria_data
      - name: Profile and clean sales
        run: python -m scripts.profile_peoria_sales
      - name: Build property-class mapping template
        run: python -m scripts.build_peoria_class_mapping
      - run: python -m pytest -q
      - name: Build evidence-gated land cohort
        run: python -m scripts.build_peoria_land_sales
      - name: Train chronological research baseline
        run: python train_peoria_baseline.py
      - name: Upload research summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peoria-research-results
          path: |
            artifacts/real_data/peoria_property_class_profile.csv
            artifacts/real_data/peoria_property_class_mapping.csv
            artifacts/peoria_baseline/metrics.json
            artifacts/verified_land/audit.json
          if-no-files-found: error
          retention-days: 14
